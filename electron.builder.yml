appId: com.agentrelaylog.v0
# productName = 설치 디렉터리(%LOCALAPPDATA%\Programs\Agent Relay)·exe·단축키 이름의 기준.
# 주의: Electron userData는 package.json "name"(agent-relay-log)을 따르므로
# 이 값을 바꿔도 사용자 settings 위치는 변하지 않는다 (마이그레이션 불필요).
productName: Agent Relay
asar: false
directories:
  output: dist
  buildResources: build
files:
  - dist/client/**/*
  - dist/server/**/*
  # electron-updater(런타임 의존성)는 electron-builder가 package.json의
  # production dependencies에서 자동 수집한다 — files 화이트리스트에 넣지 않는다.
extraMetadata:
  main: dist/server/backend/main.js
# electron-updater GitHub Release provider — used by the in-app updater.
publish:
  provider: github
  owner: ju0o
  repo: Agent-Relay
  releaseType: release
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  # 일반 Windows Desktop App 설치 UX — 경로 선택 없이 Setup → 설치 → 실행.
  oneClick: true
  perMachine: false
  # 신규 설치 경로를 %LOCALAPPDATA%\Programs\Agent Relay 로 지정 (업그레이드는 기존 위치 존중).
  include: build/installer.nsh
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agent Relay
  # 제거해도 사용자 데이터(%APPDATA% settings + DATA_ROOT)는 절대 삭제하지 않는다.
  deleteAppDataOnUninstall: false
  artifactName: AgentRelay-Setup-${version}.exe
portable:
  artifactName: AgentRelay-Portable-${version}.exe
npmRebuild: false
