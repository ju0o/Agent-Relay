# TEMPORARY Windows verification workflow (NOT part of the fix).
# Lives only on ar/win-r06-b15-01a. No packaging, no publish,
# no release, no merge. Runs build + typecheck + b15-fix-01-a gate,
# the ACTL + I3F4 regressions, then aggregate npm test for next-blocker
# discovery only (continue-on-error, do not fix).
name: Win Verify B15 Fix 01 A (take2)

on:
  push:
    branches:
      - ar/win-r06-b15-01a
  workflow_dispatch:

jobs:
  win-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client + server)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: b15-fix-01-a gate (must be full PASS)
        run: npm run test:b15-fix-01-a

      - name: ACTL managed bridge regression (must be 86/86)
        run: npm run test:actl-managed-bridge

      - name: I3F4 regression (must be 84/84)
        run: npm run test:phase-i3f4-safe-task-edit

      - name: aggregate npm test (next-blocker discovery only, do not fix)
        id: aggregate
        continue-on-error: true
        run: npm test
