# TEMPORARY Windows verification workflow (NOT part of the change).
# Lives only on ar/real-pm-host-01. No packaging, no publish,
# no release, no merge. Runs build + typecheck + the new real-pm-host
# suite (fixture LLM runtime only) + the PM-path regressions.
name: Win Verify Real PM Host

on:
  push:
    branches:
      - ar/real-pm-host-01
  workflow_dispatch:

jobs:
  win-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client + server)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: real-pm-host suite (must be full PASS)
        run: npm run test:real-pm-host

      - name: G4C bridge regression
        run: npm run test:v1-g4c-pm-host-wake

      - name: G5A regression (must be 69/69)
        run: npm run test:v1-g5a-pm-judgment

      - name: G5B regression (must be 82/82)
        run: npm run test:v1-g5b-retry-preparation
