name: Managed Relay UI Branch Check

on:
  push:
    branches:
      - dev/managed-relay-ui-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Release baseline tests
        run: npm test

      - name: Managed Relay UI contract
        run: npm run test:v2-r4-history-panel
