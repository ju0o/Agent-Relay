# TEMPORARY Windows verification workflow (NOT part of the fix).
# Lives only on ar/win-r09-v1-g5a. No packaging, no publish,
# no release, no merge. Runs build + typecheck + v1-g5a gate,
# the G6 + B15-03-A + B15-01-A + ACTL + I3F4 regressions, then aggregate
# npm test and the dedicated v1-g5b suite for NEXT-BLOCKER DISCOVERY ONLY
# (continue-on-error, do not fix).
name: Win Verify V1 G5A

on:
  push:
    branches:
      - ar/win-r09-v1-g5a
  workflow_dispatch:

jobs:
  win-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (client + server)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: v1-g5a gate (must be full PASS)
        run: npm run test:v1-g5a-pm-judgment

      - name: G6 regression (must be 14/14)
        run: npm run test:g6-worker-launch-diag

      - name: B15 fix 03 regression (must be 12/12)
        run: npm run test:b15-fix-03-a

      - name: B15 fix 01 A regression (must be 22/22)
        run: npm run test:b15-fix-01-a

      - name: ACTL managed bridge regression (must be 86/86)
        run: npm run test:actl-managed-bridge

      - name: I3F4 regression (must be 84/84)
        run: npm run test:phase-i3f4-safe-task-edit

      - name: aggregate npm test (next-blocker discovery only, do not fix)
        id: aggregate
        continue-on-error: true
        run: npm test

      - name: dedicated v1-g5b discovery (do not fix)
        id: g5b-discovery
        continue-on-error: true
        run: npm run test:v1-g5b-retry-preparation
