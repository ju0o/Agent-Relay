# TEMPORARY Windows EBUSY diagnostic (verify branch ONLY, never merge).
name: Win I3 Init EBUSY Diag

on:
  push:
    branches:
      - ar/v1-pm-win-verify-867ecb2
  workflow_dispatch:

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run EBUSY diagnostic
        run: node test/__i3-init-ebusy-diag.mjs
