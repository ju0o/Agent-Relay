name: Windows Red Triage

on:
  push:
    branches:
      - dev/windows-red-triage-01

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: QA loop regression
        run: npm run test:v1-qa-loop
      - name: G5C same-task retry regression
        run: npm run test:v1-g5c-auto-redispatch
      - name: Phase I wrapper regression
        run: npm run test:phase-i-dogfood
      - name: actl managed bridge regression
        run: npm run test:actl-managed-bridge
      - name: B15 FIX-01 regression
        run: npm run test:b15-fix-01-a
      - name: B15 FIX-03 regression
        run: npm run test:b15-fix-03-a
      - name: Full release baseline
        run: npm test
